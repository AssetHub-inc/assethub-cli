name: Publish packages
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (publish the SDK first when both change)
        required: true
        type: choice
        options: [api-client, cli]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run check
      - name: Pack, publish, and create release
        env:
          PACKAGE: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_registry() {
            local spec="$1" expected="${2:-}" directory tarball
            directory=$(mktemp -d "$RUNNER_TEMP/registry.XXXXXX")
            local deadline=$((SECONDS + 600))
            while ((SECONDS < deadline)); do
              if (cd "$directory" && env -u NODE_AUTH_TOKEN -u NPM_TOKEN NPM_CONFIG_USERCONFIG=/dev/null npm pack "$spec" --ignore-scripts --json --fetch-retries=0 --fetch-timeout=10000 --cache "$directory/cache" > pack.json); then
                tarball=$(jq -r '.[0].filename' "$directory/pack.json")
                if [ -n "$expected" ]; then
                  cmp "$expected" "$directory/$tarball" || return 1
                fi
                return 0
              fi
              echo "Waiting for npm distribution: $spec"
              sleep 15
            done
            echo "npm accepted publication but the package is not downloadable: $spec" >&2
            return 1
          }
          case "$PACKAGE" in
            api-client) PACKAGE_DIR=packages/assethub-api-client ;;
            cli)
              PACKAGE_DIR=packages/assethub-cli
              SDK_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('packages/assethub-api-client/package.json')).version")
              verify_registry "@assethub/api-client@$SDK_VERSION"
              ;;
            *) exit 1 ;;
          esac
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('$PACKAGE_DIR/package.json')).version")
          TARBALL=$(npm pack --workspace "@assethub/$PACKAGE" --pack-destination "$RUNNER_TEMP" --json | jq -r '.[0].filename')
          npm publish "$RUNNER_TEMP/$TARBALL" --access public --provenance --ignore-scripts
          printf '%s\n' "Published @assethub/$PACKAGE $VERSION to npm. See CHANGELOG.md for changes." > "$RUNNER_TEMP/release-notes.md"
          gh release create "$PACKAGE-v$VERSION" "$RUNNER_TEMP/$TARBALL" --target "$GITHUB_SHA" --title "@assethub/$PACKAGE $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          verify_registry "@assethub/$PACKAGE@$VERSION" "$RUNNER_TEMP/$TARBALL"
